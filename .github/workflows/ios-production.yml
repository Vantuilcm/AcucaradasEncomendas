name: 🚀 iOS ULTRA STABLE V4 (LOCAL)

concurrency:
  group: ios-release-v4
  cancel-in-progress: true

on:
  push:
    branches:
      - prod-release-1170
      - release-stable-1168
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'Aprovar build de produção?'
        required: true
        default: 'true'
        type: boolean

jobs:
  ios-local-pipeline:
    name: 🍎 iOS Local Build & Submit
    runs-on: macos-15
    timeout-minutes: 100
    
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_PRIVATE_KEY: ${{ secrets.EXPO_ASC_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      
      # Variáveis Públicas Obrigatórias para Validação e App
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_ENABLE_STRIPE_PAYMENTS: "false"
      
      EXPO_PUBLIC_PROJECT_ID: "6090106b-e327-4744-bce5-9ddb0d037045"
      PROFILE: "production_v13"
      APP_ENV: "production"
      EXPO_PUBLIC_APP_ENV: "production"
      EAS_PROFILE: "production_v13"
      FORCE_BUILD_MODE: "LOCAL"

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Production contract before building
        run: |
          set -euo pipefail
          echo "=== Production contract gate (no secrets printed) ==="
          EXPECT_BRANCH='safe/ae-production-ios-release-r3-r3-contract-20261026-v1'
          ORIGINAL_SHA='d93159b627693d1b2405e49e86520c52beaf1ee7'
          if [ "${GITHUB_REF_NAME}" != "${EXPECT_BRANCH}" ]; then
            echo "FAIL: GITHUB_REF_NAME mismatch"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${HEAD_SHA}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: HEAD != GITHUB_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${ORIGINAL_SHA}" HEAD; then
            echo "FAIL: Original commit is not an ancestor of HEAD"
            exit 1
          fi
          DIFF_FILES=$(git diff --name-only "${ORIGINAL_SHA}" HEAD)
          EXPECT_FILE='.github/workflows/ios-production.yml'
          if [ "${DIFF_FILES}" != "${EXPECT_FILE}" ]; then
            echo "FAIL: diff vs Original is not exclusively ios-production.yml"
            exit 1
          fi
          [ "${APP_ENV}" = "production" ] || { echo "FAIL: APP_ENV"; exit 1; }
          [ "${EXPO_PUBLIC_APP_ENV}" = "production" ] || { echo "FAIL: EXPO_PUBLIC_APP_ENV"; exit 1; }
          [ "${PROFILE}" = "production_v13" ] || { echo "FAIL: PROFILE"; exit 1; }
          [ "${EAS_PROFILE}" = "production_v13" ] || { echo "FAIL: EAS_PROFILE"; exit 1; }
          [ "${EXPO_PUBLIC_FIREBASE_PROJECT_ID}" = "acucaradas-encomendas" ] || { echo "FAIL: FIREBASE_PROJECT_ID"; exit 1; }
          if [ -z "${EXPO_PUBLIC_FIREBASE_APP_ID:-}" ]; then
            echo "FAIL: FIREBASE_APP_ID empty"
            exit 1
          fi
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "FAIL: GOOGLE_SERVICE_INFO_PLIST missing"
            exit 1
          fi
          PLIST_TMP=$(mktemp)
          if printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" | grep -q '<plist'; then
            printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" > "${PLIST_TMP}"
          else
            printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" | base64 --decode > "${PLIST_TMP}" 2>/dev/null || {
              echo "FAIL: plist neither XML nor valid Base64"
              rm -f "${PLIST_TMP}"
              exit 1
            }
          fi
          if ! grep -q 'acucaradas-encomendas' "${PLIST_TMP}"; then
            echo "FAIL: plist project identity mismatch"
            rm -f "${PLIST_TMP}"
            exit 1
          fi
          rm -f "${PLIST_TMP}"
          case "${EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}" in
            pk_live_*) ;;
            *) echo "FAIL: Stripe publishable key must be pk_live_*"; exit 1 ;;
          esac
          [ "${EXPO_PUBLIC_ENABLE_STRIPE_PAYMENTS}" = "false" ] || { echo "FAIL: Stripe payments must remain false"; exit 1; }
          echo "PASS: Production contract gate"
      - name: 🔍 Diagnose macOS/Xcode
        run: |
          echo "=== System Info ==="
          sw_vers
          echo "=== Available Xcode Versions ==="
          ls /Applications | grep Xcode || true
          echo "=== Current Xcode Selection ==="
          xcode-select -p
          echo "=== Current Xcode Version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: 🔍 Verify Selected Xcode
        run: |
          echo "=== Final Xcode Selection ==="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install Global EAS CLI & Tools
        run: |
          npm install -g eas-cli@latest
          brew install fastlane cocoapods || true
          gem install fastlane cocoapods || true

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🧪 Type Check
        run: npm run type-check

      - name: 🛡️ Build Number Enforcer (Source of Truth)
        run: |
          echo "🔄 [ENFORCE] Sincronizando Build Number..."
          node scripts/ci/force-build-number.js --run
          BUILD_NUMBER=$(jq -r '.buildNumber' version-state.json)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "CURRENT_BN=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: DIAGNOSTICO Validar Build Number Propagado
        run: |
          echo "=== VALIDANDO BUILD NUMBER NO PIPELINE ==="
          echo "1. app.json buildNumber:"
          grep '"buildNumber"' app.json || true
          echo "2. expo config buildNumber:"
          npx expo config --type public | grep -i buildNumber || true
          echo "3. Info.plist:"
          find . -name "Info.plist" -exec grep -A1 "CFBundleVersion" {} \; || true
          echo "=========================================="

      - name: Generate public_config.json
        run: |
          echo "🔄 [CONFIG] Gerando public_config.json antes do guardião"
          npx expo config --type public --json > public_config.json

      - name: 🛡️ iOS-BUILD-GUARDIAN V4 (Local Mode)
        run: |
          chmod +x ./scripts/ci/ios-build-guardian.sh
          ./scripts/ci/ios-build-guardian.sh

      - name: 📄 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v4
          path: build-logs/
          retention-days: 7
