name: 🚀 iOS ULTRA STABLE V4 (LOCAL)

concurrency:
  group: ios-release-v4
  cancel-in-progress: true

on:
  push:
    branches:
      - prod-release-1170
      - release-stable-1168
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'Aprovar build de produção?'
        required: true
        default: false
        type: boolean
      expected_source_sha:
        description: 'SHA completo (40 hex minúsculos) do commit fonte previamente aprovado'
        required: true
        type: string

jobs:
  ios-local-pipeline:
    name: 🍎 iOS Local Build & Submit
    runs-on: macos-15
    timeout-minutes: 100
    
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_PRIVATE_KEY: ${{ secrets.EXPO_ASC_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      
      # Variáveis Públicas Obrigatórias para Validação e App
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_ENABLE_STRIPE_PAYMENTS: "false"
      
      EXPO_PUBLIC_PROJECT_ID: "6090106b-e327-4744-bce5-9ddb0d037045"
      PROFILE: "production_v13"
      APP_ENV: "production"
      EXPO_PUBLIC_APP_ENV: "production"
      EAS_PROFILE: "production_v13"
      SKIP_SUBMIT: "true"
      FORCE_BUILD_MODE: "LOCAL"

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Production contract before building
        env:
          RELEASE_APPROVED: ${{ inputs.release_approved }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME:-}" != "workflow_dispatch" ] || [ "${RELEASE_APPROVED:-false}" != "true" ]; then
            echo "FAIL: explicit release approval required"
            exit 1
          fi
          echo "=== Production contract gate (no secrets printed) ==="
          # B03 release: ORIGINAL is pre-B03 port (10620551). B03 lineage is not a descendant of 1311.
          # M175: exclusive contract branch for BN 1317 from M167 tip; allowlist = exact ORIGINAL..HEAD.
          EXPECT_BRANCH='safe/ae-ios-1317-courier-server-probe-m213'
          ORIGINAL_SHA='10620551d4aab848c1b6dde35609bdfe91723c7d'
          if [ "${GITHUB_REF_NAME}" != "${EXPECT_BRANCH}" ]; then
            echo "FAIL: GITHUB_REF_NAME mismatch"
            exit 1
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "${HEAD_SHA}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: HEAD != GITHUB_SHA"
            exit 1
          fi
          # expected_source_sha: externally approved identity; fail-closed before any build
          if [ -z "${EXPECTED_SOURCE_SHA:-}" ]; then
            echo "FAIL: expected_source_sha missing"
            exit 1
          fi
          if ! printf '%s' "${EXPECTED_SOURCE_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "FAIL: expected_source_sha format invalid (need exactly 40 lowercase hex)"
            exit 1
          fi
          if [ "${EXPECTED_SOURCE_SHA}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: expected_source_sha != GITHUB_SHA"
            exit 1
          fi
          if [ "${EXPECTED_SOURCE_SHA}" != "${HEAD_SHA}" ]; then
            echo "FAIL: expected_source_sha != HEAD"
            exit 1
          fi
          echo "PASS: source SHA identity matched"
          if ! git merge-base --is-ancestor "${ORIGINAL_SHA}" HEAD; then
            echo "FAIL: Original commit is not an ancestor of HEAD"
            exit 1
          fi
          APPROVED_G06_SHA='3b9a9578a87e864ba9193d129d362df64edd96bb'
          if ! git merge-base --is-ancestor "${APPROVED_G06_SHA}" HEAD; then
            echo "FAIL: Approved G06 commit is not an ancestor of HEAD"
            exit 1
          fi
          DIFF_FILES=$(git diff --name-only "${ORIGINAL_SHA}" HEAD)
          EXPECT_FILES=$(printf '%s\n' \
            '.github/workflows/ios-production.yml' \
            'firestore.rules' \
            'src/hooks/driverOnboardingPersonalStore.ts' \
            'src/navigation/AppNavigator.tsx' \
            'src/screens/DeliveryDriverRegistration.tsx' \
            'src/screens/DriverDocumentsScreen.tsx' \
            'src/screens/EntregadorProfileScreen.tsx' \
            'src/screens/__tests__/DeliveryDriverRegistration.submit.integration.test.tsx' \
            'src/services/DeliveryDriverService.ts' \
            'storage.rules' \
            'version-state.json')
          if [ "${DIFF_FILES}" != "${EXPECT_FILES}" ]; then
            echo "FAIL: diff vs Original is not exactly the allowlisted production-contract paths"
            exit 1
          fi
          APPROVED_M006_DDS_BLOB='2d90e02ae6a70821ad1cf95b39cc9f809302e2f5'
          HEAD_DDS_BLOB=$(git rev-parse 'HEAD:src/services/DeliveryDriverService.ts')
          if [ "${HEAD_DDS_BLOB}" != "${APPROVED_M006_DDS_BLOB}" ]; then
            echo "FAIL: DeliveryDriverService blob is not the approved M006 reader blob"
            exit 1
          fi
          # G06 non-OrderService files: exact blob equality to approved G06 SHA (unchanged by B03)
          G06_INTEGRITY_FILES=$(printf '%s\n' \
            'src/screens/DriverHomeScreen.tsx' \
            'src/services/__tests__/OrderService.acceptOrderAtomic.courierUid.test.ts' \
            'src/utils/__tests__/courierAcceptAuthGate.test.ts' \
            'src/utils/courierAcceptAuthGate.ts')
          while IFS= read -r g06_path; do
            [ -n "${g06_path}" ] || continue
            HEAD_BLOB=$(git rev-parse "HEAD:${g06_path}")
            G06_BLOB=$(git rev-parse "${APPROVED_G06_SHA}:${g06_path}")
            if [ "${HEAD_BLOB}" != "${G06_BLOB}" ]; then
              echo "FAIL: G06 file content diverged from approved SHA: ${g06_path}"
              exit 1
            fi
          done <<EOF
          ${G06_INTEGRITY_FILES}
          EOF
          # OrderService: immutable B01 blob (A01 + getOrdersForDriverEarnings only)
          A01_ORDERSERVICE_BLOB='725f0364972421739fa2df877289a29c44571cb1'
          APPROVED_B01_ORDERSERVICE_BLOB='96b4ec7a4f28fe18b5050fa9f7cd5815f1213875'
          HEAD_OS_BLOB=$(git rev-parse 'HEAD:src/services/OrderService.ts')
          if [ "${HEAD_OS_BLOB}" != "${APPROVED_B01_ORDERSERVICE_BLOB}" ]; then
            echo "FAIL: OrderService HEAD blob is not the approved B01 earnings reader blob"
            exit 1
          fi
          OS_DIFF=$(git diff --no-color "${A01_ORDERSERVICE_BLOB}" "${APPROVED_B01_ORDERSERVICE_BLOB}" || true)
          if ! printf '%s\n' "${OS_DIFF}" | grep -q 'async getOrdersForDriverEarnings(driverId: string)'; then
            echo "FAIL: approved B01 OrderService delta missing getOrdersForDriverEarnings"
            exit 1
          fi
          if printf '%s\n' "${OS_DIFF}" | grep -E '^[+-].*acceptOrderAtomic|^[+-].*DRIVER_USERID_REQUIRED|^[+-].*validatedUserId|^[+-].*G06_R3' >/dev/null; then
            echo "FAIL: OrderService A01→B01 delta touches acceptOrderAtomic/G06 Auth UID contract"
            exit 1
          fi
          if ! printf '%s\n' "${OS_DIFF}" | grep -q '^@@ -137,6 +137,56 @@'; then
            echo "FAIL: OrderService A01→B01 delta hunk anchor unexpected (must remain earnings-only insert)"
            exit 1
          fi
          # B03 sanitized Driver Documents blobs (exact)
          APPROVED_B03_DRIVER_DOCUMENTS_BLOB='381422039a50f879c9ec1b7d3a6ff3bbcbe1a4ee'
          APPROVED_B03_PERSONAL_STORE_BLOB='100435ef0b1763aeefc5c1dfeda8c312bb85992b'
          HEAD_DD_BLOB=$(git rev-parse 'HEAD:src/screens/DriverDocumentsScreen.tsx')
          HEAD_PS_BLOB=$(git rev-parse 'HEAD:src/hooks/driverOnboardingPersonalStore.ts')
          if [ "${HEAD_DD_BLOB}" != "${APPROVED_B03_DRIVER_DOCUMENTS_BLOB}" ]; then
            echo "FAIL: DriverDocumentsScreen blob is not the approved B03 sanitized blob"
            exit 1
          fi
          if [ "${HEAD_PS_BLOB}" != "${APPROVED_B03_PERSONAL_STORE_BLOB}" ]; then
            echo "FAIL: driverOnboardingPersonalStore blob is not the approved B03 sanitized blob"
            exit 1
          fi
          # M167 functional blobs (exact) — fail-closed locks for courier Rules + registration
          APPROVED_M167_DDR_BLOB='25ecda670185a6b68f7c1f38139606fcf16af7d7'
          APPROVED_M167_RULES_BLOB='983115477d61985a75aab142574bfd39de72a746'
          APPROVED_M167_DDR_SUBMIT_TEST_BLOB='450d0fd97df22252a0a3ec9ba42f34ca413a67fb'
          HEAD_DDR_BLOB=$(git rev-parse 'HEAD:src/screens/DeliveryDriverRegistration.tsx')
          HEAD_RULES_BLOB=$(git rev-parse 'HEAD:firestore.rules')
          HEAD_DDR_TEST_BLOB=$(git rev-parse 'HEAD:src/screens/__tests__/DeliveryDriverRegistration.submit.integration.test.tsx')
          if [ "${HEAD_DDR_BLOB}" != "${APPROVED_M167_DDR_BLOB}" ]; then
            echo "FAIL: DeliveryDriverRegistration blob is not the approved M167 blob"
            exit 1
          fi
          if [ "${HEAD_RULES_BLOB}" != "${APPROVED_M167_RULES_BLOB}" ]; then
            echo "FAIL: firestore.rules blob is not the approved M167 blob"
            exit 1
          fi
          if [ "${HEAD_DDR_TEST_BLOB}" != "${APPROVED_M167_DDR_SUBMIT_TEST_BLOB}" ]; then
            echo "FAIL: DeliveryDriverRegistration submit integration test blob is not the approved M167 blob"
            exit 1
          fi
          [ "${APP_ENV}" = "production" ] || { echo "FAIL: APP_ENV"; exit 1; }
          [ "${EXPO_PUBLIC_APP_ENV}" = "production" ] || { echo "FAIL: EXPO_PUBLIC_APP_ENV"; exit 1; }
          [ "${PROFILE}" = "production_v13" ] || { echo "FAIL: PROFILE"; exit 1; }
          [ "${EAS_PROFILE}" = "production_v13" ] || { echo "FAIL: EAS_PROFILE"; exit 1; }
          [ "${EXPO_PUBLIC_FIREBASE_PROJECT_ID}" = "acucaradas-encomendas" ] || { echo "FAIL: FIREBASE_PROJECT_ID"; exit 1; }
          if [ -z "${EXPO_PUBLIC_FIREBASE_APP_ID:-}" ]; then
            echo "FAIL: FIREBASE_APP_ID empty"
            exit 1
          fi
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "FAIL: GOOGLE_SERVICE_INFO_PLIST missing"
            exit 1
          fi
          PLIST_TMP=$(mktemp)
          if printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" | grep -q '<plist'; then
            printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" > "${PLIST_TMP}"
          else
            printf '%s' "${GOOGLE_SERVICE_INFO_PLIST}" | base64 --decode > "${PLIST_TMP}" 2>/dev/null || {
              echo "FAIL: plist neither XML nor valid Base64"
              rm -f "${PLIST_TMP}"
              exit 1
            }
          fi
          if ! grep -q 'acucaradas-encomendas' "${PLIST_TMP}"; then
            echo "FAIL: plist project identity mismatch"
            rm -f "${PLIST_TMP}"
            exit 1
          fi
          rm -f "${PLIST_TMP}"
          case "${EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}" in
            pk_live_*) ;;
            *) echo "FAIL: Stripe publishable key must be pk_live_*"; exit 1 ;;
          esac
          [ "${EXPO_PUBLIC_ENABLE_STRIPE_PAYMENTS}" = "false" ] || { echo "FAIL: Stripe payments must remain false"; exit 1; }
          echo "PASS: Production contract gate"
      - name: 🔍 Diagnose macOS/Xcode
        run: |
          echo "=== System Info ==="
          sw_vers
          echo "=== Available Xcode Versions ==="
          ls /Applications | grep Xcode || true
          echo "=== Current Xcode Selection ==="
          xcode-select -p
          echo "=== Current Xcode Version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: 🔍 Verify Selected Xcode
        run: |
          echo "=== Final Xcode Selection ==="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install Global EAS CLI & Tools
        run: |
          npm install -g eas-cli@latest
          brew install fastlane cocoapods || true
          gem install fastlane cocoapods || true

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🧪 Type Check
        run: npm run type-check

      - name: 🛡️ Build Number Enforcer (Source of Truth)
        run: |
          set -euo pipefail
          echo "🔄 [ENFORCE] Sincronizando Build Number..."
          node scripts/ci/force-build-number.js --run
          TARGET_VERSION='1.1.8'
          TARGET_BUILD='1318'
          TARGET_BUNDLE='com.acucaradas.encomendas'
          APP_VERSION=$(jq -er '.expo.version' app.json)
          STATE_VERSION=$(jq -er '.version' version-state.json)
          APP_BUILD=$(jq -er '.expo.ios.buildNumber' app.json)
          STATE_BUILD=$(jq -er '.buildNumber' version-state.json)
          APP_BUNDLE=$(jq -er '.expo.ios.bundleIdentifier' app.json)
          [ "$APP_VERSION" = "$TARGET_VERSION" ] || { echo 'FAIL: app version mismatch'; exit 1; }
          [ "$STATE_VERSION" = "$TARGET_VERSION" ] || { echo 'FAIL: version-state version mismatch'; exit 1; }
          [ "$APP_BUILD" = "$TARGET_BUILD" ] || { echo 'FAIL: app build number mismatch'; exit 1; }
          [ "$STATE_BUILD" = "$TARGET_BUILD" ] || { echo 'FAIL: version-state build number mismatch'; exit 1; }
          [ "$APP_BUNDLE" = "$TARGET_BUNDLE" ] || { echo 'FAIL: bundle identifier mismatch'; exit 1; }
          BUILD_NUMBER="$STATE_BUILD"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "CURRENT_BN=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: DIAGNOSTICO Validar Build Number Propagado
        run: |
          echo "=== VALIDANDO BUILD NUMBER NO PIPELINE ==="
          echo "1. app.json buildNumber:"
          grep '"buildNumber"' app.json || true
          echo "2. expo config buildNumber:"
          npx expo config --type public | grep -i buildNumber || true
          echo "3. Info.plist:"
          find . -name "Info.plist" -exec grep -A1 "CFBundleVersion" {} \; || true
          echo "=========================================="

      - name: Generate public_config.json
        run: |
          echo "🔄 [CONFIG] Gerando public_config.json antes do guardião"
          npx expo config --type public --json > public_config.json

      - name: 🛡️ iOS-BUILD-GUARDIAN V4 (Local Mode)
        run: |
          chmod +x ./scripts/ci/ios-build-guardian.sh
          ./scripts/ci/ios-build-guardian.sh

      - name: 📦 Upload Production IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-ipa-v4
          path: |
            build-*.ipa
            *.ipa
          if-no-files-found: error
          retention-days: 7

      - name: 📄 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v4
          path: build-logs/
          retention-days: 7
