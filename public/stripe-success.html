<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retornando ao aplicativo...</title>

  <script>
    function openApp() {
      window.location.href = "acucaradas://stripe/success";

      setTimeout(() => {
        document.getElementById("fallback").style.display = "block";
      }, 2500);
    }

    window.onload = openApp;
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 400px;
    }

    h1 {
      color: #e91e63;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      background: #e91e63;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }

    #fallback {
      display: none;
    }
  </style>

</head>

<body>

  <div class="container">

    <h1>Cadastro concluído 🎉</h1>

    <p>
      Estamos retornando você para o aplicativo Açucaradas Encomendas.
    </p>

    <div id="fallback">
      <p>
        Caso o aplicativo não abra automaticamente:
      </p>

      <a href="acucaradas://stripe/success">
        Voltar para o aplicativo
      </a>
    </div>

  </div>

</body>
</html>
