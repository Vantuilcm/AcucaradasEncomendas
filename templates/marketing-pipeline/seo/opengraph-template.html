<!--
  Open Graph + Twitter Card — copiar para <head> da landing
  Substituir {{VARIÁVEIS}} após geração IA
-->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Açucaradas Encomendas" />
<meta property="og:locale" content="pt_BR" />
<meta property="og:title" content="{{OG_TITLE}}" />
<meta property="og:description" content="{{OG_DESCRIPTION}}" />
<meta property="og:url" content="{{CANONICAL_URL}}" />
<!-- Imagem 1200x630 quando asset existir -->
<meta property="og:image" content="{{OG_IMAGE_URL}}" />
<meta property="og:image:alt" content="{{OG_IMAGE_ALT}}" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="{{OG_TITLE}}" />
<meta name="twitter:description" content="{{OG_DESCRIPTION}}" />
<meta name="twitter:image" content="{{OG_IMAGE_URL}}" />

<!-- WhatsApp preview usa og:title, og:description, og:image -->
