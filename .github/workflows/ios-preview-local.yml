# CPA Week 1 + Courier — iOS preview LOCAL (GitHub Actions macOS, zero EAS cloud credits)
# Profile: preview only — never production / production_v13
name: iOS Preview Local (CPA + Courier)

concurrency:
  group: ios-preview-operational
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      baseline_commit:
        description: 'Commit baseline da app (CPA + Courier) — deve ser ancestral de HEAD'
        required: true
        default: '88064fe6dad4040cc0f491c0d4fbca316322afe0'
      strict_commit_check:
        description: 'Falhar se baseline_commit não for ancestral de HEAD'
        required: true
        default: true
        type: boolean
      ref:
        description: 'Branch ou ref para build (vazio = branch atual do dispatch)'
        required: false
        default: ''

jobs:
  preview-local-build:
    name: iOS Preview Local — Operational Validation
    runs-on: macos-15
    timeout-minutes: 120

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_PRIVATE_KEY: ${{ secrets.EXPO_ASC_PRIVATE_KEY }}
      EXPO_ASC_PRIVATE_KEY_BASE64: ${{ secrets.EXPO_ASC_PRIVATE_KEY_BASE64 }}
      EXPO_APPLE_TEAM_ID: ${{ secrets.EXPO_APPLE_TEAM_ID }}
      # Preview: iOS GoogleService exclusively from SANDBOX base64.
      # Do NOT inject GOOGLE_SERVICE_INFO_PLIST — Guardian would overwrite the validated plist.
      GOOGLE_SERVICES_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICES_INFO_PLIST_BASE64_SANDBOX }}
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_PROJECT_ID: '6090106b-e327-4744-bce5-9ddb0d037045'
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY_SANDBOX }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN_SANDBOX }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID_SANDBOX }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET_SANDBOX }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID_SANDBOX }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID_SANDBOX }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY_SANDBOX }}
      EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
      APP_ENV: preview
      EXPO_PUBLIC_APP_ENV: preview
      EXPO_PUBLIC_ENABLE_STRIPE_ACCOUNT_PERSIST: 'true'
      EXPO_PUBLIC_ENABLE_STRIPE_PAYMENTS: 'true'
      SKIP_SUBMIT: 'true'
      PROFILE: preview
      EAS_PROFILE: preview
      FORCE_BUILD_MODE: LOCAL
      AE_IOS_BUILD_MAX_ATTEMPTS: '1'
      BASELINE_COMMIT: ${{ github.event.inputs.baseline_commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Diagnose macOS/Xcode
        run: |
          echo "=== System Info ==="
          sw_vers
          ls /Applications | grep Xcode || true
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install EAS CLI and build tools
        run: |
          npm install -g eas-cli@latest
          brew install cocoapods || true
          gem install cocoapods || true
          echo "CI=true" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      # RellBuild validate-env.js exige ficheiros no workspace ANTES da validação (run 26766367770 falhou por ordem invertida)
      - name: Validate Stripe test publishable key
        shell: bash
        run: |
          STRIPE_KEY="${EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
          if [[ ! "$STRIPE_KEY" =~ ^pk_test_[A-Za-z0-9]+$ ]]; then
            echo "::error::Preview Stripe publishable key must be a Stripe test key."
            exit 1
          fi
          echo "STRIPE_TEST_PUBLISHABLE_KEY_GATE=PASS"
      - name: Validate Firebase Sandbox project identity
        shell: bash
        run: |
          EXPECTED_FIREBASE_PROJECT_ID='acucaradas-encomendas-sandbox'
          if [ "${EXPO_PUBLIC_FIREBASE_PROJECT_ID:-}" != "$EXPECTED_FIREBASE_PROJECT_ID" ]; then
            echo "::error::Preview Firebase project identity mismatch"
            exit 1
          fi
          echo "FIREBASE_SANDBOX_PROJECT_ID_GATE=PASS"
      - name: Materialize Firebase config from secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
            echo "✅ google-services.json ($(wc -c < google-services.json | tr -d ' ') bytes)"
          else
            echo "❌ GOOGLE_SERVICES_JSON ausente nos secrets do workflow"
            exit 1
          fi
          # Fail-closed: Sandbox base64 only — no GOOGLE_SERVICE_INFO_PLIST fallback
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST must not be set in Preview (sandbox-only source)"
            exit 1
          fi
          if [ -z "${GOOGLE_SERVICES_INFO_PLIST_BASE64:-}" ]; then
            echo "::error::Preview requires GOOGLE_SERVICES_INFO_PLIST_BASE64_SANDBOX"
            exit 1
          fi
          echo "${GOOGLE_SERVICES_INFO_PLIST_BASE64}" | base64 --decode > GoogleService-Info.plist
          if [ ! -s GoogleService-Info.plist ]; then
            echo "::error::GoogleService-Info.plist missing or empty after decode"
            exit 1
          fi
          echo "✅ GoogleService-Info.plist ($(wc -c < GoogleService-Info.plist | tr -d ' ') bytes)"
          EXPECTED_PLIST_PROJECT_ID='acucaradas-encomendas-sandbox'
          if ! ACTUAL_PLIST_PROJECT_ID="$(/usr/libexec/PlistBuddy -c 'Print :PROJECT_ID' GoogleService-Info.plist)"; then
            echo "::error::GoogleService-Info.plist PROJECT_ID unreadable"
            exit 1
          fi
          if [ -z "${ACTUAL_PLIST_PROJECT_ID}" ] || [ "${ACTUAL_PLIST_PROJECT_ID}" != "${EXPECTED_PLIST_PROJECT_ID}" ]; then
            echo "::error::GoogleService-Info.plist PROJECT_ID identity mismatch"
            exit 1
          fi
          echo "GOOGLESERVICE_PLIST_PROJECT_ID_GATE=PASS"

      # R50: install once, run after materialize and again pre-Guardian (same script = harness parity).
      - name: Install Firebase JS/plist multifield consistency gate
        shell: bash
        run: |
          set -euo pipefail
          GATE_SCRIPT="${RUNNER_TEMP:-/tmp}/ae-firebase-js-plist-multifield-gate.sh"
          cat > "$GATE_SCRIPT" <<'AE_FIREBASE_MULTIFIELD_GATE_EOF'
          #!/usr/bin/env bash
          # AE_FIREBASE_JS_PLIST_MULTIFIELD_GATE — Preview fail-closed identity
          set -euo pipefail
          PLIST="${AE_GOOGLESERVICE_PLIST_PATH:-GoogleService-Info.plist}"
          EXPECTED_PROJECT_ID='acucaradas-encomendas-sandbox'
          EXPECTED_BUNDLE_ID='com.acucaradas.encomendas'
          EXPECTED_AUTH_DOMAIN="${EXPECTED_PROJECT_ID}.firebaseapp.com"

          fail() { echo "::error::$1"; exit 1; }

          if [ ! -s "$PLIST" ]; then
            fail "GoogleService-Info.plist missing or empty"
          fi
          if [ -n "${GOOGLE_SERVICE_INFO_PLIST:-}" ]; then
            fail "GOOGLE_SERVICE_INFO_PLIST must not be set when validating Preview plist identity"
          fi

          plist_get() {
            local key="$1"
            local val
            if ! val="$(/usr/libexec/PlistBuddy -c "Print :${key}" "$PLIST" 2>/dev/null)"; then
              fail "plist field ${key} unreadable"
            fi
            val="$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$val" ]; then
              fail "plist field ${key} empty"
            fi
            printf '%s' "$val"
          }

          require_env() {
            local name="$1"
            local val
            val="$(printenv "$name" 2>/dev/null || true)"
            val="$(printf '%s' "$val" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            if [ -z "$val" ]; then
              fail "required env ${name} missing or empty"
            fi
            printf '%s' "$val"
          }

          eq_or_fail() {
            local label="$1"
            local actual="$2"
            local expected="$3"
            if [ "$actual" != "$expected" ]; then
              fail "${label} identity mismatch"
            fi
          }

          PLIST_PROJECT_ID="$(plist_get PROJECT_ID)"
          PLIST_GOOGLE_APP_ID="$(plist_get GOOGLE_APP_ID)"
          PLIST_GCM_SENDER_ID="$(plist_get GCM_SENDER_ID)"
          PLIST_API_KEY="$(plist_get API_KEY)"
          PLIST_STORAGE_BUCKET="$(plist_get STORAGE_BUCKET)"
          PLIST_BUNDLE_ID="$(plist_get BUNDLE_ID)"

          ENV_PROJECT_ID="$(require_env EXPO_PUBLIC_FIREBASE_PROJECT_ID)"
          ENV_APP_ID="$(require_env EXPO_PUBLIC_FIREBASE_APP_ID)"
          ENV_SENDER="$(require_env EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID)"
          ENV_API_KEY="$(require_env EXPO_PUBLIC_FIREBASE_API_KEY)"
          ENV_BUCKET="$(require_env EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET)"
          ENV_AUTH_DOMAIN="$(require_env EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN)"

          eq_or_fail "PROJECT_ID" "$PLIST_PROJECT_ID" "$EXPECTED_PROJECT_ID"
          eq_or_fail "EXPO_PUBLIC_FIREBASE_PROJECT_ID" "$ENV_PROJECT_ID" "$EXPECTED_PROJECT_ID"
          eq_or_fail "GOOGLE_APP_ID/EXPO_PUBLIC_FIREBASE_APP_ID" "$PLIST_GOOGLE_APP_ID" "$ENV_APP_ID"
          eq_or_fail "GCM_SENDER_ID/EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID" "$PLIST_GCM_SENDER_ID" "$ENV_SENDER"
          eq_or_fail "API_KEY/EXPO_PUBLIC_FIREBASE_API_KEY" "$PLIST_API_KEY" "$ENV_API_KEY"
          # Exact match only — no appspot↔firebasestorage.app rewrite without proof
          eq_or_fail "STORAGE_BUCKET/EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET" "$PLIST_STORAGE_BUCKET" "$ENV_BUCKET"
          eq_or_fail "BUNDLE_ID" "$PLIST_BUNDLE_ID" "$EXPECTED_BUNDLE_ID"
          eq_or_fail "AUTH_DOMAIN" "$ENV_AUTH_DOMAIN" "$EXPECTED_AUTH_DOMAIN"

          if [ "${#ENV_API_KEY}" -lt 10 ]; then
            fail "EXPO_PUBLIC_FIREBASE_API_KEY too short for Preview (recovery fallback risk)"
          fi

          echo "FIREBASE_JS_PLIST_MULTIFIELD_CONSISTENCY_GATE=PASS"
          AE_FIREBASE_MULTIFIELD_GATE_EOF
          # Dedent YAML-indented heredoc body (portable on macos-15)
          export GATE_SCRIPT
          python3 -c 'import os,textwrap,pathlib; p=pathlib.Path(os.environ["GATE_SCRIPT"]); p.write_text(textwrap.dedent(p.read_text()), encoding="utf-8")'
          chmod +x "$GATE_SCRIPT"
          echo "AE_FIREBASE_MULTIFIELD_GATE_SCRIPT=$GATE_SCRIPT" >> "$GITHUB_ENV"
          echo "FIREBASE_MULTIFIELD_GATE_INSTALLED=PASS"

      - name: Firebase JS/plist multifield consistency gate
        shell: bash
        run: |
          set -euo pipefail
          bash "${AE_FIREBASE_MULTIFIELD_GATE_SCRIPT}"

      - name: Validate environment (fail-fast)
        run: node scripts/validate-env.js

      - name: Pre-flight validation (commit, CPA, profile)
        run: |
          set -euo pipefail
          echo "=== BRANCH ==="
          git branch --show-current
          echo "=== COMMIT (git rev-parse HEAD) ==="
          git rev-parse HEAD
          echo "=== BASELINE (CPA + Courier app commit) ==="
          echo "$BASELINE_COMMIT"
          if [ "${{ github.event.inputs.strict_commit_check }}" = "true" ]; then
            if ! git merge-base --is-ancestor "$BASELINE_COMMIT" HEAD; then
              echo "❌ Baseline $BASELINE_COMMIT is NOT an ancestor of HEAD $(git rev-parse HEAD)"
              exit 1
            fi
            echo "✅ Baseline $BASELINE_COMMIT is ancestor of HEAD (app code includes CPA + Courier)"
          else
            echo "⚠️ strict_commit_check disabled"
          fi
          echo "=== EXPO_PUBLIC_ENABLE_STRIPE_ACCOUNT_PERSIST ==="
          echo "$EXPO_PUBLIC_ENABLE_STRIPE_ACCOUNT_PERSIST"
          if [ "$EXPO_PUBLIC_ENABLE_STRIPE_ACCOUNT_PERSIST" != "true" ]; then
            echo "❌ Persist flag must be true for this operational build"
            exit 1
          fi
          echo "=== eas.json preview env (grep) ==="
          grep -A12 '"preview"' eas.json | head -16 || true
          echo "=== BLOCKED profiles check ==="
          if [ "$EAS_PROFILE" = "production" ] || [ "$EAS_PROFILE" = "production_v13" ]; then
            echo "❌ Forbidden profile: $EAS_PROFILE"
            exit 1
          fi
          echo "✅ Profile: $EAS_PROFILE (local build, no EAS cloud credits)"
          echo "=== eas config preview (resolved) ==="
          eas config --profile preview --platform ios 2>&1 | tail -20 || true

      - name: Type check
        run: npm run type-check

      - name: Build Number Enforcer (Source of Truth)
        run: |
          node scripts/ci/force-build-number.js --run
          BUILD_NUMBER=$(jq -r '.buildNumber' version-state.json)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "CURRENT_BN=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: Generate public_config.json
        run: npx expo config --type public --json > public_config.json

      # Final multifield identity gate immediately before Guardian (last writer before eas build).
      # Unset GOOGLE_SERVICE_INFO_PLIST so Guardian cannot silently replace the validated file.
      - name: Pre-Guardian Firebase JS/plist multifield consistency gate
        shell: bash
        run: |
          set -euo pipefail
          unset GOOGLE_SERVICE_INFO_PLIST || true
          echo "GOOGLE_SERVICE_INFO_PLIST=" >> "$GITHUB_ENV"
          export GOOGLE_SERVICE_INFO_PLIST=
          bash "${AE_FIREBASE_MULTIFIELD_GATE_SCRIPT}"
          echo "PRE_GUARDIAN_FIREBASE_JS_PLIST_MULTIFIELD_CONSISTENCY_GATE=PASS"

      - name: iOS Build Guardian (local preview)
        shell: bash
        run: |
          set -euo pipefail
          unset GOOGLE_SERVICE_INFO_PLIST || true
          export GOOGLE_SERVICE_INFO_PLIST=
          chmod +x ./scripts/ci/ios-build-guardian.sh
          ./scripts/ci/ios-build-guardian.sh

      - name: Stage preview IPA artifact
        if: success()
        run: |
          set -euo pipefail
          mkdir -p dist
          LATEST_IPA=$(ls -t build-*.ipa 2>/dev/null | head -n 1 || ls -t *.ipa 2>/dev/null | head -n 1 || true)
          if [ -z "$LATEST_IPA" ]; then
            echo "❌ IPA não encontrada após build local"
            exit 1
          fi
          cp "$LATEST_IPA" dist/preview-local.ipa
          echo "PREVIEW_IPA=dist/preview-local.ipa" >> $GITHUB_ENV
          ls -lh dist/preview-local.ipa

      - name: Capture build metadata
        if: always()
        run: |
          echo "## iOS Preview Local Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Mode | LOCAL (GitHub Actions macOS) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Profile | preview |" >> "$GITHUB_STEP_SUMMARY"
          echo "| HEAD commit | \`$(git rev-parse HEAD)\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Baseline | \`$BASELINE_COMMIT\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Persist flag | $EXPO_PUBLIC_ENABLE_STRIPE_ACCOUNT_PERSIST |" >> "$GITHUB_STEP_SUMMARY"
          echo "| EAS cloud credits | 0 (eas build --local) |" >> "$GITHUB_STEP_SUMMARY"
          if [ -f dist/preview-local.ipa ]; then
            echo "| IPA artifact | preview-local.ipa |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload preview IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview-local-${{ github.run_number }}
          path: |
            dist/preview-local.ipa
            build-logs/
            build-*.ipa
            *.ipa
          retention-days: 14
          if-no-files-found: warn
