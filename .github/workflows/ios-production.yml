name: 🚀 iOS ULTRA STABLE V4 (LOCAL)

concurrency:
  group: ios-release-v4
  cancel-in-progress: true

on:
  push:
    branches:
      - prod-release-1170
      - release-stable-1168
  workflow_dispatch:
    inputs:
      release_approved:
        description: 'Aprovar build de produção?'
        required: true
        default: 'true'
        type: boolean

jobs:
  ios-local-pipeline:
    name: 🍎 iOS Local Build & Submit
    runs-on: macos-15
    timeout-minutes: 100
    
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      EXPO_ASC_KEY_ID: ${{ secrets.EXPO_ASC_KEY_ID }}
      EXPO_ASC_ISSUER_ID: ${{ secrets.EXPO_ASC_ISSUER_ID }}
      EXPO_ASC_PRIVATE_KEY: ${{ secrets.EXPO_ASC_PRIVATE_KEY }}
      GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      
      # Variáveis Públicas Obrigatórias para Validação e App
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_ONESIGNAL_APP_ID: ${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}
      EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_ENABLE_STRIPE_PAYMENTS: "false"
      
      EXPO_PUBLIC_PROJECT_ID: "6090106b-e327-4744-bce5-9ddb0d037045"
      PROFILE: "production_v13"
      FORCE_BUILD_MODE: "LOCAL"

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Diagnose macOS/Xcode
        run: |
          echo "=== System Info ==="
          sw_vers
          echo "=== Available Xcode Versions ==="
          ls /Applications | grep Xcode || true
          echo "=== Current Xcode Selection ==="
          xcode-select -p
          echo "=== Current Xcode Version ==="
          xcodebuild -version
          echo "=== Available SDKs ==="
          xcodebuild -showsdks

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      - name: 🔍 Verify Selected Xcode
        run: |
          echo "=== Final Xcode Selection ==="
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install Global EAS CLI & Tools
        run: |
          npm install -g eas-cli@latest
          brew install fastlane cocoapods || true
          gem install fastlane cocoapods || true

      - name: 📦 Install dependencies
        run: npm install --legacy-peer-deps

      - name: 🧪 Type Check
        run: npm run type-check

      - name: 🛡️ Build Number Enforcer (Source of Truth)
        run: |
          echo "🔄 [ENFORCE] Sincronizando Build Number..."
          node scripts/ci/force-build-number.js --run
          BUILD_NUMBER=$(jq -r '.buildNumber' version-state.json)
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "CURRENT_BN=$BUILD_NUMBER" >> $GITHUB_ENV

      - name: DIAGNOSTICO Validar Build Number Propagado
        run: |
          echo "=== VALIDANDO BUILD NUMBER NO PIPELINE ==="
          echo "1. app.json buildNumber:"
          grep '"buildNumber"' app.json || true
          echo "2. expo config buildNumber:"
          npx expo config --type public | grep -i buildNumber || true
          echo "3. Info.plist:"
          find . -name "Info.plist" -exec grep -A1 "CFBundleVersion" {} \; || true
          echo "=========================================="

      - name: Validate Firebase Production project identity
        shell: bash
        run: |
          if [ "${EXPO_PUBLIC_FIREBASE_PROJECT_ID:-}" != "acucaradas-encomendas" ]; then
            echo "::error::FIREBASE_PRODUCTION_PROJECT_ID_GATE=FAIL"
            exit 1
          fi
          echo "FIREBASE_PRODUCTION_PROJECT_ID_GATE=PASS"

      - name: Validate Stripe live publishable key
        shell: bash
        run: |
          STRIPE_KEY="${EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}"
          if [[ ! "$STRIPE_KEY" =~ ^pk_live_[A-Za-z0-9]+$ ]]; then
            echo "::error::STRIPE_LIVE_PUBLISHABLE_KEY_GATE=FAIL"
            exit 1
          fi
          echo "STRIPE_LIVE_PUBLISHABLE_KEY_GATE=PASS"
          unset STRIPE_KEY

      - name: Generate public_config.json
        run: |
          echo "🔄 [CONFIG] Gerando public_config.json antes do guardião"
          npx expo config --type public --json > public_config.json

      - name: 🛡️ iOS-BUILD-GUARDIAN V4 (Local Mode)
        run: |
          chmod +x ./scripts/ci/ios-build-guardian.sh
          ./scripts/ci/ios-build-guardian.sh

      - name: Stage IPA + SHA256 metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          IPA_CANDIDATES=( *.ipa )
          IPA_COUNT=${#IPA_CANDIDATES[@]}
          if [ "$IPA_COUNT" -eq 0 ]; then
            echo "::error::IPA_TRACEABILITY_GATE=FAIL_ZERO_CANDIDATES"
            exit 1
          fi
          if [ "$IPA_COUNT" -ne 1 ]; then
            echo "::error::IPA_TRACEABILITY_GATE=FAIL_MULTIPLE_CANDIDATES count=${IPA_COUNT}"
            exit 1
          fi
          SOURCE_IPA="${IPA_CANDIDATES[0]}"
          cp "$SOURCE_IPA" dist/production-local.ipa
          IPA_BASENAME="$(basename "$SOURCE_IPA")"
          IPA_BYTES="$(wc -c < dist/production-local.ipa | tr -d ' ')"
          IPA_SHA256="$(shasum -a 256 dist/production-local.ipa | awk '{print $1}')"
          BUILD_NUMBER_VALUE="${BUILD_NUMBER:-}"
          if [ -z "$BUILD_NUMBER_VALUE" ] && [ -f version-state.json ]; then
            BUILD_NUMBER_VALUE="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('version-state.json','utf8')); process.stdout.write(String(v.buildNumber ?? ''))")"
          fi
          MARKETING_VERSION_VALUE="${MARKETING_VERSION:-}"
          if [ -z "$MARKETING_VERSION_VALUE" ] && [ -f version-state.json ]; then
            MARKETING_VERSION_VALUE="$(node -e "const fs=require('fs'); const v=JSON.parse(fs.readFileSync('version-state.json','utf8')); process.stdout.write(String(v.version ?? ''))")"
          fi
          {
            echo "ipa_basename=${IPA_BASENAME}"
            echo "ipa_bytes=${IPA_BYTES}"
            echo "sha256=${IPA_SHA256}"
            echo "github.workflow=${{ github.workflow }}"
            echo "github.run_id=${{ github.run_id }}"
            echo "github.run_attempt=${{ github.run_attempt }}"
            echo "github.sha=${{ github.sha }}"
            echo "github.ref_name=${{ github.ref_name }}"
            echo "profile=${PROFILE}"
            echo "force_build_mode=${FORCE_BUILD_MODE}"
            echo "build_number=${BUILD_NUMBER_VALUE}"
            echo "marketing_version=${MARKETING_VERSION_VALUE}"
          } > dist/production-build-metadata.txt
          echo "IPA_TRACEABILITY_GATE=PASS"
          echo "IPA_SHA256=${IPA_SHA256}"
          echo "IPA_BYTES=${IPA_BYTES}"

      - name: Upload Production IPA + metadata
        uses: actions/upload-artifact@v4
        with:
          name: production-ipa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/production-local.ipa
            dist/production-build-metadata.txt
          retention-days: 14
          if-no-files-found: error

      - name: 📄 Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-v4
          path: build-logs/
          retention-days: 7
