<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e91e63" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Sessão de cadastro financeiro expirada. Retorne ao aplicativo Açucaradas Encomendas."
    />
    <title>Sessão expirada — Açucaradas Encomendas</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: linear-gradient(135deg, #fff8e1 0%, #ffffff 50%, #fff3e0 100%);
        color: #333;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fff;
        border-radius: 16px;
        padding: 32px 28px;
        box-shadow: 0 8px 32px rgba(255, 152, 0, 0.12);
        text-align: center;
      }
      .brand {
        font-size: 0.85rem;
        font-weight: 600;
        color: #e91e63;
        letter-spacing: 0.02em;
        margin-bottom: 20px;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        background: #fff3e0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        line-height: 1;
      }
      h1 {
        font-size: 1.25rem;
        color: #f57c00;
        margin-bottom: 12px;
        font-weight: 700;
      }
      p {
        font-size: 1rem;
        line-height: 1.6;
        color: #555;
      }
      .footer {
        margin-top: 24px;
        font-size: 0.78rem;
        color: #aaa;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="brand">Açucaradas Encomendas</p>
      <div class="icon" aria-hidden="true">↻</div>
      <h1>Sessão expirada</h1>
      <p style="margin-bottom: 12px;">
        Sua sessão de cadastro financeiro expirou.
      </p>
      <p>
        Volte ao aplicativo <strong>Açucaradas Encomendas</strong>, abra
        <strong>Conta Bancária</strong> e tente configurar seus recebimentos
        novamente.
      </p>
      <p class="footer">
        Configuração de recebimentos via Stripe Connect · Açucaradas Encomendas
      </p>
    </main>
  </body>
</html>
